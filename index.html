<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冒险者测验</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2B2140;
  --muted: #6E6585;
  --paper: #F2EEF7;
  --card: #FFFFFF;
  --line: #DCD3E8;
  --ruby: #C2405A;
  --emerald: #2A8763;
  --topaz: #B67A12;
  --sapphire: #3C68C6;
  --lit: #2B2140;
  --lit-ink: #FFFFFF;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #EDE8F5;
    --muted: #A99FC0;
    --paper: #1C1629;
    --card: #2A2140;
    --line: #42375C;
    --ruby: #F07A90;
    --emerald: #5CC79C;
    --topaz: #E8B04A;
    --sapphire: #86A8F0;
    --lit: #EDE8F5;
    --lit-ink: #1C1629;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
main {
  max-width: 520px;
  margin: 0 auto;
  padding: 28px 16px calc(40px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}
.screen { display: none; }
.screen.on { display: block; }
h1, h2, .display { font-family: var(--display); font-weight: 400; letter-spacing: 0.02em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sapphire); outline-offset: 2px; }

/* ---------- 开始页 ---------- */
.die { width: 72px; height: 72px; color: var(--ruby); display: block; }
.start h1 { font-size: 40px; line-height: 1.2; margin: 24px 0 12px; }
.start .lead { color: var(--muted); margin: 0 0 32px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.field input {
  width: 100%;
  font: inherit;
  font-size: 18px;
  padding: 14px 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
}
.field input:focus { border-color: var(--sapphire); outline: none; }
.err { color: var(--ruby); font-size: 14px; min-height: 22px; margin: 6px 0 0; }
.primary {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: var(--ink);
  color: var(--paper);
  font-size: 18px;
  font-weight: 600;
}
.primary:active { transform: translateY(1px); }

/* ---------- 章节过渡 ---------- */
.chapter { padding-top: 18vh; }
.chapter h2 { font-size: 34px; line-height: 1.25; margin: 0 0 16px; }
.chapter p { font-size: 18px; margin: 0; }

/* ---------- 答题页 ---------- */
.ticks { display: flex; gap: 8px; margin-bottom: 14px; }
.ticks .grp { flex: 1; display: flex; gap: 2px; }
.ticks i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.ticks i.done { background: var(--ink); }
.ticks i.now { background: var(--ruby); }
.ticks i.skip { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.where { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
.question { font-size: 22px; line-height: 1.45; font-weight: 600; margin: 0 0 6px; }
.q-hint { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.opts { display: grid; gap: 10px; }
.opt {
  position: relative;
  text-align: left;
  padding: 13px 16px 13px 48px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  font-size: 16px;
  line-height: 1.5;
  transition: border-color .12s, background .12s;
}
@media (hover: hover) { .opt:hover { border-color: var(--muted); } }
.opt::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 50%;
  width: 20px;
  height: 20px;
  margin-top: -10px;
  border: 2px solid var(--line);
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 14px;
  line-height: 16px;
  text-align: center;
  font-weight: 700;
}
.opt.picked { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.opt.picked::before { content: "✓"; border-color: var(--paper); background: var(--paper); color: var(--ink); }
.q-note { min-height: 22px; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.q-note.warn { color: var(--ruby); }
.next { margin-top: 6px; }
.next:disabled { opacity: .3; cursor: default; }
.subrow { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.back, .swap {
  padding: 8px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 15px;
}
.swap { text-decoration: underline; text-underline-offset: 3px; }
.back[hidden] { visibility: hidden; display: inline; }
.swap:disabled { text-decoration: none; opacity: .6; cursor: default; }

/* ---------- 掷骰 ---------- */
.rolling { padding-top: 24vh; text-align: center; }
.rolling .die { width: 120px; height: 120px; margin: 0 auto 24px; }
.rolling p { color: var(--muted); }
.spin { animation: roll 1.4s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes roll {
  0% { transform: rotate(0) scale(.6); }
  70% { transform: rotate(980deg) scale(1.08); }
  100% { transform: rotate(1080deg) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ---------- 结果页 ---------- */
.card-head { margin-bottom: 28px; }
.card-head .label { color: var(--muted); font-size: 14px; margin: 0; }
.card-head .who { font-size: 30px; margin: 2px 0 16px; line-height: 1.2; word-break: break-all; }
.concept { font-family: var(--display); font-size: 26px; line-height: 1.5; margin: 0 0 10px; }
.concept .c { color: var(--ruby); }
.concept .s { color: var(--emerald); }
.concept .b { color: var(--topaz); }
.concept .a { color: var(--sapphire); }
.tagline { color: var(--muted); margin: 0; }

.block {
  background: var(--card);
  border-radius: 16px;
  padding: 20px 18px 16px;
  margin-bottom: 16px;
  border-top: 6px solid var(--line);
}
.block.c { border-top-color: var(--ruby); }
.block.s { border-top-color: var(--emerald); }
.block.b { border-top-color: var(--topaz); }
.block.a { border-top-color: var(--sapphire); }
.block h2 { font-size: 20px; margin: 0 0 12px; }
.block.c h2 { color: var(--ruby); }
.block.s h2 { color: var(--emerald); }
.block.b h2 { color: var(--topaz); }
.block.a h2 { color: var(--sapphire); }
.pick-main .nm { font-size: 24px; font-weight: 700; line-height: 1.3; }
.nm .en { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.pick-main p { margin: 6px 0 0; }
.diff { font-size: 14px; color: var(--muted); margin-top: 4px; }
.diff .star { letter-spacing: 2px; color: var(--ink); }
.alts { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.alts .lbl { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
.alt { margin: 0 0 8px; font-size: 15px; line-height: 1.5; }
.alt b { font-size: 16px; }
.alt .en { color: var(--muted); font-size: 13px; margin: 0 4px; }
.tagline-s { display: block; font-size: 13px; color: var(--muted); }
.sub-note { font-size: 13px; color: var(--muted); margin: -4px 0 14px; }
.sub { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--paper); font-size: 14px; line-height: 1.6; }
.sub b { font-size: 16px; }
.sub .en { color: var(--muted); font-size: 13px; margin: 0 4px; }
.sub-l { display: inline-block; font-size: 12px; color: var(--paper); background: var(--ruby); border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 2px; }
.sub-others { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.fit { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; font-size: 13px; color: var(--muted); }
.fit-bar { flex: 1; max-width: 180px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fit-bar i { display: block; height: 100%; background: var(--ruby); border-radius: 3px; }
.fit-n { font-weight: 700; color: var(--ink); min-width: 2.6em; }
.pick-main .fit { font-size: 14px; }
.pick-main .fit-bar { height: 8px; max-width: 220px; }

.grid9 { display: grid; grid-template-columns: 2.4em repeat(3, 1fr); gap: 4px; margin-top: 4px; font-size: 14px; text-align: center; }
.grid9 .ax { color: var(--muted); align-self: center; padding: 4px 0; }
.grid9 .cell { padding: 10px 2px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
.grid9 .cell.lit { background: var(--lit); color: var(--lit-ink); border-color: var(--lit); font-weight: 700; }
.align-desc { margin: 12px 0 0; }

.lore {
  font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
  font-size: 16px;
  line-height: 1.9;
  margin: 10px 0 0;
  padding-left: 12px;
  border-left: 3px solid var(--line);
}
.block.c .lore { border-left-color: var(--ruby); }
.block.s .lore { border-left-color: var(--emerald); }
.block.a .lore { border-left-color: var(--sapphire); }
.plain { font-size: 15px; color: var(--muted); margin: 10px 0 0; }
.more { margin-top: 4px; }
.more summary { font-size: 14px; color: var(--muted); cursor: pointer; padding: 4px 0; }
.more .lore { font-size: 15px; }

.axes { margin: 16px 0 0; display: grid; gap: 14px; }
.axis-row { display: grid; grid-template-columns: 2.6em 1fr 2.6em; align-items: center; gap: 8px; font-size: 14px; }
.axis-row .end { color: var(--muted); }
.axis-row .end:last-child { text-align: right; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--line); }
.track .third { position: absolute; top: -3px; width: 1px; height: 14px; background: var(--muted); opacity: .5; }
.track .dot { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--sapphire); border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--sapphire); }
.axis-note { font-size: 13px; color: var(--muted); margin: 4px 0 0; line-height: 1.5; }
.like { margin: 10px 0 0; font-size: 15px; }
.warn { margin: 12px 0 0; font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--paper); }

.note { color: var(--muted); font-size: 14px; margin: 20px 0 0; }
.status { margin: 24px 0 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); font-size: 15px; }
.status button { border: 0; background: none; padding: 0; color: var(--sapphire); text-decoration: underline; font-size: 15px; }
.again { background: none; color: var(--ink); border: 2px solid var(--ink); }
</style>
</head>
<body>
<main>

<!-- 开始 -->
<section class="screen start on" id="s-start">
  <svg class="die" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"/><polygon points="50,24 74,66 26,66"/><path d="M50 5 50 24M89 27.5 74 66M11 27.5 26 66M50 95 26 66M50 95 74 66M89 72.5 74 66M11 72.5 26 66M11 27.5 50 24M89 27.5 50 24"/></g></svg>
  <h1>你会是什么样的冒险者？</h1>
  <p class="lead">59 道题，大约 17 分钟，每次打开题目都不太一样。每题可以选一个或两个；都不像你，可以换一道。答完会推荐适合你的职业、物种、背景和阵营，凭第一感觉选就好，没有对错。</p>
  <div class="field">
    <label for="name">你的名字</label>
    <p class="hint">主持人靠这个名字认出你，用群里的昵称就行</p>
    <input id="name" maxlength="20" autocomplete="nickname" placeholder="比如：小王">
    <p class="err" id="name-err" role="alert"></p>
  </div>
  <button class="primary" id="btn-start">开始答题</button>
</section>

<!-- 章节过渡 -->
<section class="screen chapter" id="s-chapter">
  <h2 id="ch-title"></h2>
  <p id="ch-text"></p>
  <button class="primary" id="btn-chapter">继续</button>
</section>

<!-- 答题 -->
<section class="screen" id="s-quiz">
  <div class="ticks" id="ticks" aria-hidden="true"></div>
  <div class="where"><span id="ch-label"></span><span id="q-count"></span></div>
  <p class="question" id="q-text"></p>
  <p class="q-hint">选一个最像你的；两个都像，也可以选两个</p>
  <div class="opts" id="q-opts"></div>
  <p class="q-note" id="q-note" role="status"></p>
  <button class="primary next" id="btn-next" disabled>下一题</button>
  <div class="subrow">
    <button class="back" id="btn-back">← 上一题</button>
    <button class="swap" id="btn-swap">都不像我，换一道</button>
  </div>
</section>

<!-- 掷骰 -->
<section class="screen rolling" id="s-roll">
  <svg class="die" id="roll-die" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"><polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"/><polygon points="50,24 74,66 26,66"/><path d="M50 5 50 24M89 27.5 74 66M11 27.5 26 66M50 95 26 66M50 95 74 66M89 72.5 74 66M11 72.5 26 66M11 27.5 50 24M89 27.5 50 24"/></g><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor" stroke="none">20</text></svg>
  <p>命运的骰子正在转动……</p>
</section>

<!-- 结果 -->
<section class="screen" id="s-result">
  <div class="card-head">
    <p class="label">冒险者登记卡</p>
    <h1 class="who" id="r-name"></h1>
    <p class="concept" id="r-concept"></p>
    <p class="tagline" id="r-tagline"></p>
  </div>

  <div class="block c">
    <h2>职业</h2>
    <div id="r-class"></div>
  </div>
  <div class="block s">
    <h2>物种</h2>
    <div id="r-species"></div>
  </div>
  <div class="block b">
    <h2>背景（当冒险者之前的身份）</h2>
    <div id="r-bg"></div>
  </div>
  <div class="block a">
    <h2>阵营</h2>
    <div class="grid9" id="r-grid"></div>
    <div id="r-align"></div>
  </div>

  <p class="note">推荐只是参考。每项给了三个，挑你最喜欢的那个就行，最后跟主持人商量。</p>
  <div class="status" id="r-status" role="status"></div>
  <button class="primary again" id="btn-again">重新测一次</button>
</section>

</main>

<script>
/* ============ 设置 ============
   把 Google 表格脚本部署后得到的网址，粘贴到下面的引号里。
   留空的话，结果不会发给主持人（适合自己先试玩）。 */
var SHEET_URL = "https://script.google.com/macros/s/AKfycbyZns1e0GEYFsOjs5O7vhjglOnJiPHgfGkYp4EZYqeF8PkvXcbskg8hAM8ckfrWcUdx/exec";
</script>
<script>
// ===== 题库与结果数据 =====
// 名称采用《5E 不全书》的译法
var QUIZ = {};

QUIZ.classes = [
  { id: "fighter", zh: "战士", en: "Fighter", stars: 1,
    desc: "武器专家，什么兵器都会用，稳定可靠，新手首选",
    lore: "铁与汗水铸成的人。别人祈祷、念咒的时候，你在擦拭兵刃。剑、斧、长枪、弓弩，到了你手里都只是手臂的延伸。你的力量没有任何神秘可言——它来自一万次挥砍、一千场苦战，和那口从不认输的气。当队伍陷入绝境时，最后还站着的，往往是你。" },
  { id: "barbarian", zh: "野蛮人", en: "Barbarian", stars: 1,
    desc: "一发怒就变成人形坦克，抗揍、伤害高，操作最简单",
    lore: "你的血里住着一场风暴。平日里，它沉睡如山；一旦被激怒，它便呼啸而出——那不是寻常的愤怒，而是猛兽扑食时的凶性、雷霆劈落时的轰鸣。刀剑砍在你身上像挠痒，敌人在你的咆哮里发抖。你不需要什么战术，因为你本身就是一场天灾。" },
  { id: "rogue", zh: "游荡者", en: "Rogue", stars: 2,
    desc: "潜行、开锁、偷袭样样精通，找准时机给敌人致命一击",
    lore: "你是阴影里的一声轻笑。锁在你指尖叹息着打开，陷阱在你脚下默默失效，守卫直到倒下的那一刻才察觉你的存在。你不屑正面硬拼——一击，只需要一击，落在最致命的地方。世人叫你小偷、刺客、间谍，你只当那是对手艺的夸奖。" },
  { id: "ranger", zh: "游侠", en: "Ranger", stars: 2,
    desc: "野外专家兼神射手，擅长追踪，还会一点自然魔法",
    lore: "城市的喧嚣与你无关，你属于荒野的边缘。你读得懂折断的草茎、泥里的爪印、风中若有若无的血腥味。你的箭从不虚发，你的脚步惊不起一只飞鸟。在文明与蛮荒的交界处，你是那道看不见的防线，守护着沉睡的村庄，却从不留下名字。" },
  { id: "paladin", zh: "圣武士", en: "Paladin", stars: 2,
    desc: "立下誓言的神圣骑士，能打能扛还能治疗",
    lore: "你曾在某个黎明立下誓言，从此，那句誓言便成了你的骨。为它，你披上重甲，挡在弱者身前；为它，你的剑刃燃起圣光，你的双手能抚平伤痛。誓言给你力量，也是你的枷锁——一旦背弃，光便会离你而去。你是行走的誓约，是黑夜里一面不倒的旗。" },
  { id: "monk", zh: "武僧", en: "Monk", stars: 2,
    desc: "徒手功夫高手，速度快、连击多，像武侠片主角",
    lore: "你把自己的身体炼成了兵器。在晨钟暮鼓之间，你学会了呼吸，学会了静坐，也学会了让一拳快过离弦之箭。你踏水而行，飞檐走壁，徒手接下劈来的刀锋。别人追求身外之物的力量，你追问的只有一件事：一个人，究竟能走多远？" },
  { id: "cleric", zh: "牧师", en: "Cleric", stars: 2,
    desc: "神明的代言人，能治疗、能加护，也能抡锤子，队伍的定心丸",
    lore: "神明在你耳边低语，而你替祂把话说给人间听。你一手持圣徽，一手握战锤：既能在战场上为伙伴合拢伤口、驱散恐惧，也能降下神怒，让亡灵化为灰烬。你未必是最强的那个，却永远是大家最需要的那个——因为有你在，倒下的人就还能站起来。" },
  { id: "bard", zh: "吟游诗人", en: "Bard", stars: 2,
    desc: "靠音乐和嘴皮子的万金油，会魔法、会鼓舞队友，还能忽悠敌人",
    lore: "传说世界诞生于一首歌，而你记得其中几个音符。你的琴声能让懦夫拔剑，你的一句俏皮话能让国王大笑、让敌人发愣。你走遍天涯，收集故事，也制造故事。魔法、剑术、谎言和真心，你都略懂一二——在你看来，人生本就是一场值得被传唱的冒险。" },
  { id: "warlock", zh: "魔契师", en: "Warlock", stars: 2,
    desc: "和神秘存在签了契约换来力量，招牌技能是一发“魔能爆”",

  { id: "duergar", zh: "灰矮人", en: "Duergar", look: "touch", tags: ["stone", "shadow", "arcane"],

    desc: "小小的龙族亲戚，喜欢群居，会大吼吓唬敌人",
    lore: "狗头人是矮小的爬虫族群，自认是巨龙的远亲，对龙怀着近乎崇拜的敬畏。单个狗头人也许不起眼，但他们擅长抱团、设陷阱和出奇制胜。狗头人尖声一吼，能把比自己大好几倍的敌人吓一跳。" },
  { id: "lizardfolk", zh: "蜥蜴人", en: "Lizardfolk", look: "animal", tags: ["water", "wild"],
    desc: "冷血的蜥蜴人，能憋气、能咬人，想法非常实际",
    lore: "蜥蜴人生活在沼泽深处，冷血也冷静，看世界的方式极其实际：能吃吗？有用吗？危险吗？他们不太懂人情世故，却能潜在水下很久，一口利齿和一身厚鳞让他们在荒野里所向披靡。" },
  { id: "minotaur", zh: "牛头人", en: "Minotaur", look: "animal", tags: ["big", "wild"],
    desc: "牛头人身，能用角把敌人撞飞",
    lore: "牛头人长着雄壮的牛首和弯角，体格如山。他们冲锋起来势不可挡，一对犄角能把敌人撞飞出去。据说牛头人天生认得路，在迷宫里也永远不会迷失方向。他们勇猛直率，最瞧不起背后耍手段的人。" },
  { id: "satyr", zh: "半羊人", en: "Satyr", look: "touch", tags: ["joy", "fey", "city"],
    desc: "羊角羊腿的妖精，爱音乐爱派对，跳得特别高",
    lore: "半羊人上半身似人，下半身是毛茸茸的羊腿，头顶一对弯角。他们来自妖精荒野，热爱音乐、美酒和派对，人生信条就是“尽兴”。半羊人跳得又高又远，对魔法也有天生的抵抗力。" },
  { id: "seaelf", zh: "海精灵", en: "Sea Elf", look: "touch", tags: ["water", "fey"],
    desc: "住在海里的精灵，能水下呼吸，能和海洋生物交流",
    lore: "海精灵的祖先是很久以前爱上大海的精灵。他们在珊瑚与海藻间筑起城市，与鱼群和海豚为伴，能在水下自由呼吸。陆地对他们来说是新奇的远方，正如大海对陆地居民一样。" },
  { id: "shadarkai", zh: "影灵", en: "Shadar-kai", look: "touch", tags: ["shadow", "fey"],
    desc: "来自阴影世界的精灵，能短距离瞬移，带点阴郁气质",
    lore: "影灵是生活在堕影冥界的精灵，那是一个灰暗、寂静、连色彩都会褪去的世界。漫长的岁月让他们的气质染上一层阴郁和冷淡。影灵能在阴影之间瞬间穿梭，仿佛自己也是一道影子。" },
  { id: "shifter", zh: "化兽者", en: "Shifter", look: "touch", tags: ["wild", "forest"],
    desc: "有野兽血统，战斗时能短暂变得更像野兽",
    lore: "化兽者的祖先与狼人、熊人这类兽化人有着血缘，于是他们身上留着野兽的影子：锐利的眼神、浓密的毛发、灵敏的嗅觉。战斗时，化兽者能短暂唤醒体内的野兽，变得更凶猛、更敏捷。" },
  { id: "tabaxi", zh: "斑猫人", en: "Tabaxi", look: "animal", tags: ["wild", "joy", "shadow"],
    desc: "猫人，好奇心旺盛，爬墙飞快，爆发起来跑得超快",
    lore: "斑猫人身形修长，长着猫的面孔和斑纹皮毛。他们的好奇心比猫还旺盛：故事、宝物、秘密，任何新奇的东西都会让他们两眼放光。斑猫人爬墙如履平地，一时兴起能跑得飞快，跑完又懒洋洋地趴下打盹。" },
  { id: "tortle", zh: "龟人", en: "Tortle", look: "animal", tags: ["water", "calm"],
    desc: "背着壳的乌龟人，天生防御高，性格悠闲",
    lore: "龟人背着一面厚重的甲壳，走到哪里，家就在哪里。他们生性悠闲，热爱旅行，喜欢在海边慢慢看日出日落。龟人的一生并不长，所以他们格外珍惜每一段旅程——慢一点，才能走得远。" },
  { id: "triton", zh: "梭螺鱼人", en: "Triton", look: "touch", tags: ["water", "holy"],
    desc: "深海来的守护者，能水下呼吸，有点小骄傲",
    lore: "梭螺鱼人是深海的守护者，世世代代守卫着海底，抵御来自深渊的邪恶。他们能在水下呼吸，能和海洋生物交谈。刚上岸的梭螺鱼人常常带着一点高傲和天真，不太习惯陆地居民的“无知”。" },
  { id: "yuanti", zh: "蛇人", en: "Yuan-ti", look: "touch", tags: ["shadow", "arcane"],
    desc: "带蛇类特征的人，天生抗魔法、抗毒",
    lore: "蛇人身上带着蛇的印记：鳞片、竖瞳，或是分叉的舌头。传说他们的祖先为了追求力量，向蛇神献上了自己的人性。如今的蛇人冒险者天生抗毒抗魔，冷静得让人发毛，正努力写下与祖先不同的故事。" },
  { id: "loxodon", zh: "象族", en: "Loxodon", look: "animal", tags: ["big", "calm"],
    desc: "大象人，沉稳睿智，鼻子能拿东西",
    lore: "象族长着大象的面容和长鼻，身材高大，性情沉稳。他们以平和与智慧闻名，记性好得惊人，能把整部史诗一字不差地背下来。象族的长鼻灵活如手，厚实的皮肤也像一层天然的铠甲。" },
  { id: "vedalken", zh: "维多肯", en: "Vedalken", look: "touch", tags: ["arcane", "calm", "tech"],
    desc: "蓝皮肤，冷静理性，做什么都追求完美",
    lore: "维多肯有着蓝色的皮肤和冷静的头脑，他们相信世间万物都还有改进的空间。在维多肯眼里，失败只是下一次成功的数据。他们追求的不是完美本身，而是一点点逼近完美的那个过程。" },
  { id: "simic", zh: "析米克混生体", en: "Simic Hybrid", look: "alien", tags: ["wild", "water", "tech"],
    desc: "被魔法改造过的人，身上嫁接了动物特征",
    lore: "析米克混生体是魔法与生物实验的产物：人的身体上嫁接了动物的特征，也许是滑翔用的翼膜、带吸盘的触手，也许是甲壳和夜视的眼睛。他们是活生生的“进化”，每一个混生体都独一无二。" },
  { id: "leonin", zh: "狮族", en: "Leonin", look: "animal", tags: ["wild", "big"],
    desc: "狮子人，骄傲威猛，一声咆哮能吓住敌人",
    lore: "狮族是骄傲的草原猎手，长着狮子的面孔和鬃毛。他们以部族为家，崇尚勇气和自立。狮族一声咆哮，足以让敌人心胆俱裂；当他们奔跑在金色的草原上时，就像一束燃烧的阳光。" },
  { id: "owlin", zh: "枭人", en: "Owlin", look: "animal", tags: ["sky", "shadow", "arcane"],
    desc: "猫头鹰人，能飞，夜里看得清，动作悄无声息",
    lore: "枭人长着猫头鹰般的羽毛和一双大眼睛，夜色中也能看清一切。他们振翅时几乎没有声音，常常像幽灵一样从高处滑翔而下。枭人好学睿智，又带着一点夜行动物特有的神秘。" },
  { id: "astralelf", zh: "星界精灵", en: "Astral Elf", look: "touch", tags: ["arcane", "holy", "sky"],
    desc: "住在星界的精灵，身上带着星光",
    lore: "星界精灵是很久以前离开大地、移居星界的精灵。在那片时间几乎静止的银色虚空里，他们身上沾染了星辰的光辉。星界精灵的眼中闪着星光，他们见过的世界，比任何人都多。" },
  { id: "autognome", zh: "自动侏儒", en: "Autognome", look: "alien", tags: ["joy", "small", "tech"],
    desc: "侏儒造出来的小机器人，有了自己的意识",
    lore: "自动侏儒是侏儒发明家造出来的机械小人，原本只是帮手或玩具，却不知从哪天起有了自己的意识。他们靠齿轮、发条和魔法运转，好奇地打量着这个世界，努力弄明白“活着”到底是什么感觉。" },
  { id: "giff", zh: "诘弗人", en: "Giff", look: "animal", tags: ["big", "tech"],
    desc: "河马人，体格魁梧，热爱火药和军队生活",
    lore: "诘弗人长着河马般的大脑袋和魁梧的身躯，是星界里出了名的雇佣兵。他们热爱军队生活、纪律，还有……火药。诘弗人嗓门大、讲礼数，打起仗来却像一辆横冲直撞的战车。" },
  { id: "hadozee", zh: "鼯猴人", en: "Hadozee", look: "animal", tags: ["sky", "water", "joy"],
    desc: "像猴子的种族，能张开手臂下的膜滑翔，常在船上当水手",
    lore: "鼯猴人长得像猴子，手臂和身体之间有一层皮膜，张开就能滑翔。他们手脚灵活，天生是攀爬和航海的好手，常在星界飞船和海船上当水手。鼯猴人热情又爱冒险，最喜欢从高处纵身一跃的感觉。" },
  { id: "plasmoid", zh: "流浆体", en: "Plasmoid", look: "alien", tags: ["water", "shadow"],
    desc: "一团有意识的软泥，能变形，能挤过很窄的缝",
    lore: "流浆体是一团有意识的软泥，没有骨头，也没有固定的形状。他们可以伸出触手般的“手臂”，也能把自己挤进一道细缝。流浆体看世界的方式和谁都不一样，常常对人类的习俗既困惑又好奇。" },
  { id: "thrikreen", zh: "螳螂人", en: "Thri-kreen", look: "alien", tags: ["arcane", "calm", "wild"],
    desc: "像螳螂的虫人，四只手臂，不用睡觉，会心灵感应",
    lore: "螳螂人是长着四只手臂的虫族，甲壳会随环境变色。他们从不睡觉，只需要静静休息；他们不靠嘴说话，而是用心灵感应交流。螳螂人看起来冷漠，其实对同伴极其忠诚，会把队友当成自己的族群。" },
  { id: "kender", zh: "坎德人", en: "Kender", look: "touch", tags: ["joy", "small", "city"],
    desc: "小个子，天不怕地不怕，好奇心重，嘴特别会气人",
    lore: "坎德人个子小小，天不怕地不怕，好奇心重得没边。别人的口袋、上锁的箱子、禁止入内的房间，在他们看来都像是一封邀请函。坎德人那张嘴更厉害，一句话就能把对手气得跳脚，露出破绽。" },
  { id: "warforged", zh: "战俑", en: "Warforged", look: "alien", tags: ["calm", "holy", "big"],
    desc: "为战争制造的活体魔像，有了自我意识，正在寻找人生意义",
    lore: "战俑是为一场漫长战争制造的活体魔像，由木头、金属和石头组成，体内燃着魔法的火花。战争结束了，他们却留了下来，带着自我意识和一身伤痕。战俑不吃不睡，却在努力学一件比打仗更难的事：怎样生活。" },
  { id: "kalashtar", zh: "离梦人", en: "Kalashtar", look: "human", tags: ["arcane", "holy", "calm"],
    desc: "人类和梦境灵体结合而成，会心灵感应，沉静神秘",
    lore: "离梦人是人类与来自梦境之界的灵体结合而成的族群。他们的梦里住着另一个灵魂，与他们分享记忆和智慧。离梦人宁静而深邃，能用心灵与人交谈，一生都在对抗那片想要吞噬梦境的黑暗。" },
  { id: "khoravar", zh: "科拉瓦", en: "Khoravar", look: "human", tags: ["fey", "city"],
    desc: "精灵和人类血脉交融而成的民族，天生会牵线搭桥",
    lore: "科拉瓦是艾伯伦世界里精灵与人类血脉交融的后裔，经过许多代人，已经成为一个独立的民族。他们身上带着一丝妖精般的灵动，善于在不同的人群之间牵线搭桥，是交易、外交和情报网里少不了的人物。" },
  { id: "verdan", zh: "佛丹人", en: "Verdan", look: "touch", tags: ["arcane", "city"],
    desc: "绿皮肤的小个子，会心灵感应，身体会随成长不断变化",
    lore: "佛丹人是一个年轻的种族，皮肤是绿色的，耳朵又尖又长，据说诞生于一场混沌魔法的意外。他们的身体会随着成长不断变化，个子也会越长越高。佛丹人天生会心灵感应，总想弄明白自己从哪里来。" },
  { id: "dhampir", zh: "半血裔", en: "Dhampir", look: "human", tags: ["shadow", "wild"],
    desc: "半吸血鬼，能飞檐走壁，咬人还能恢复体力",
    lore: "半血裔身上流着吸血鬼的血，却仍是活人。他们苍白而优雅，能像蜘蛛一样贴着墙壁行走，一口咬下去还能从敌人身上汲取力量。半血裔一生都在与体内的饥渴较量——是成为怪物，还是成为猎杀怪物的人？" },
  { id: "hexblood", zh: "巫咒之子", en: "Hexblood", look: "touch", tags: ["shadow", "fey", "arcane"],
    desc: "和鬼婆（古老的女巫）有过契约的人，能下咒，也能变装",
    lore: "巫咒之子与鬼婆——一种古老而邪异的女巫——之间有过某种约定，从此身上出现了奇异的印记。他们能施下诅咒、改换容貌，还能把自己的一缕头发当作信物交给别人，隔着很远传递心意。他们身上总带着一点童话故事里的诡异魅力。" },
  { id: "lupin", zh: "人狼裔", en: "Lupin", look: "animal", tags: ["wild", "forest", "shadow"],
    desc: "像狼人一样的种族，会嚎叫，扑倒敌人是拿手好戏",
    lore: "人狼裔是带着狼人血脉的族群，长着狼的面孔和锋利的爪牙。他们嗅觉灵敏，听觉过人，一声长嚎能让同伴振奋、让敌人胆寒。猛地扑倒猎物、咬住不放，是他们最拿手的战斗方式。" },
  { id: "reborn", zh: "复生者", en: "Reborn", look: "touch", tags: ["shadow", "tech", "calm"],
    desc: "死而复生的人，记忆残缺，不需要吃喝睡觉",
    lore: "复生者曾经死去，又被某种力量带回人间——也许是死灵法术，也许是一场无法解释的奇迹。他们的记忆支离破碎，身体不再需要食物和睡眠。复生者带着一个问题行走世间：我是谁？我为什么会回来？" },
  { id: "duskling", zh: "暮精", en: "Duskling", look: "touch", tags: ["fey", "arcane", "small"],
    desc: "离开妖精国度的流浪民族，能随时调整自己的魔法天赋（2026年新物种）",
    lore: "暮精是离开妖精荒野的游牧民族，赶着畜群在各个位面之间迁徙。妖精的魔法仍在他们体内流淌，让他们可以随时调换自己的天赋：今天力大如牛，明天心思敏捷。暮精从小就爱玩大胆的游戏，蹦跳起来又高又远。" }
];

// ===== 备用题：点“都不像我，换一道”时，从同一类里换一道选项完全不同的题 =====
function hinted(fx) {
  // 背景备用题也顺带给职业 +1（跟正式背景题一样）
  return fx.map(function (f) {
    var p = Object.keys(f.b).filter(function (k) { return f.b[k] === 2; })[0];
    var cls = BG_HINT[p];
    var o = {}, k;
    for (k in f) o[k] = f[k];
    var c = {}; c[cls] = 1; o.c = c;
    return o;
  });
}

// ===== 计分逻辑 =====
var LOOK_W = 3.0; // 外形题的分量

// 把一道题的回答统一成“选了哪几个选项”的数组：[] 表示跳过
function quizPicks(ans) {
  if (ans === undefined || ans === null) return [];
  if (typeof ans === "number") return [ans];
  return ans;
}

// 每一项在“随便乱选”时的平均分和波动，用来把分数拉到同一把尺子上。
// 只算回答了的题，跳过的题不算进去。
function quizStats(Q, answers) {
  var st = { c: {}, s: {}, l: {}, b: {}, y: {} };
  var used = Q.questions.filter(function (qq, qi) {
    return !answers || quizPicks(answers[qi]).length > 0;
  });
  ["c", "s", "l", "b", "y"].forEach(function (k) {
    var ids = {};
    Q.questions.forEach(function (qq) {
      qq.o.forEach(function (op) { Object.keys(op[k] || {}).forEach(function (id) { ids[id] = 1; }); });
    });
    Object.keys(ids).forEach(function (id) {
      var mu = 0, v = 0;
      used.forEach(function (qq) {
        var n = qq.o.length;
        var vals = qq.o.map(function (op) { return (op[k] && op[k][id]) || 0; });
        var m = vals.reduce(function (a, b) { return a + b; }, 0) / n;
        var m2 = vals.reduce(function (a, b) { return a + b * b; }, 0) / n;
        mu += m; v += m2 - m * m;
      });
      st[k][id] = { mu: mu, sd: Math.sqrt(v) || 1 };
    });
  });
  return st;
}

function shuffled(n, rand) {
  var order = [];
  for (var i = 0; i < n; i++) order.push(i);
  for (var j = n - 1; j > 0; j--) {
    var r = Math.floor(rand() * (j + 1));
    var tmp = order[j]; order[j] = order[r]; order[r] = tmp;
  }
  return order;
}

// 把一个题位（或备用题）变成一道要显示的题：随机挑一种问法，打乱选项顺序
function makeQuestion(slot, rand) {
  var KEYS = ["c", "s", "l", "b", "a", "y"];
  var opts = slot.fx.map(function (fx) {
    var o = {};
    KEYS.forEach(function (k) { if (fx[k]) o[k] = fx[k]; });
    return o;
  });
  var vi = Math.floor(rand() * slot.v.length);
  var v = slot.v[vi];
  return { kind: slot.kind, o: opts, vi: vi, q: v[0], texts: v.slice(1), order: shuffled(opts.length, rand), spare: -1 };
}

// 一道题“考的是哪几样东西”，用来挑一道尽量不重样的备用题
function questionKeys(q) {
  if (q.kind === "align") return [q.o.some(function (o) { return o.a && o.a.lc === 2; }) ? "lc" : "ge"];
  return q.o.map(function (o) {
    var e = o.c || o.s || o.b || o.y || o.l || {};
    var ks = Object.keys(e);
    var best = ks[0];
    ks.forEach(function (k) { if (e[k] > e[best]) best = k; });
    return best;
  });

function quizBuildRun(Q, rand) {

// 换一道：从同一类的备用题里，挑一道跟当前题重样最少的。没有可换的就返回 false。
function quizSwap(run, i) {
  var cur = run.questions[i];
  var curKeys = questionKeys(cur);
  var best = -1, bestScore = Infinity;
  run.spareOrder.forEach(function (si) {
    var sp = run.spares[si];

    var keys = questionKeys(makeQuestion(sp, function () { return 0; }));
    var overlap = keys.filter(function (k) { return curKeys.indexOf(k) !== -1; }).length;

    if (cur.kind === "align") overlap = overlap ? 0 : 1;
    if (overlap < bestScore) { bestScore = overlap; best = si; }

  if (best === -1) return false;
  run.spareUsed[best] = true;
  var q = makeQuestion(run.spares[best], run.rand);
  q.spare = best;
  run.questions[i] = q;
  return true;
}

function quizCanSwap(run, i) {
  var kind = run.questions[i].kind;
  return run.spareOrder.some(function (si) { return !run.spareUsed[si] && run.spares[si].kind === kind; });

    return ((pts[k][id] || 0) - s.mu) / s.sd;
  }
  // 职业和背景的出场次数已经完全拉平，直接比原始分（减去平均值），打平时按名字随机决定
  function raw(k, id) {
    var s = st[k][id];
    return (pts[k][id] || 0) - (s ? s.mu : 0);
  }
  var CAL = Q.calib || {};
  function cal(kind, id) { return (CAL[kind] && CAL[kind][id]) || 0; }
  function jitter(id) { return nameHash((name || "") + "|" + id) * 0.01; }
  function top3(list, scorer) {
    return list
      .map(function (item) { return { item: item, score: scorer(item) + jitter(item.id) }; })
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, 3)
      .map(function (x) { return x.item; });
  }

  // 职业：三个推荐里至少一个近战、一个施法
  var MELEE = ["fighter", "barbarian", "rogue", "monk", "paladin"];
  var CASTER = ["wizard", "sorcerer", "warlock", "cleric", "druid", "bard"];
  var ranked = Q.classes
    .map(function (item) { return { item: item, score: raw("c", item.id) + cal("c", item.id) + jitter(item.id) }; })
    .sort(function (a, b) { return b.score - a.score; })
    .map(function (x) { return x.item; });
  var classes = ranked.slice(0, 3);
  var classForced = [null, null, null];
  function has(group) { return classes.some(function (c) { return group.indexOf(c.id) !== -1; }); }
  function best(group) { return ranked.filter(function (c) { return group.indexOf(c.id) !== -1; })[0]; }
  if (!has(MELEE)) { classes[2] = best(MELEE); classForced[2] = "melee"; }
  if (!has(CASTER)) {
    var slot = classForced[2] ? 1 : 2;
    classes[slot] = best(CASTER); classForced[slot] = "caster";
  }
  // 契合度：和“随便乱答”的人比，你在这个职业上的分数高出多少（换算成 1~99）
  var classPct = classes.map(function (c) {
    var s = st.c[c.id];
    var z = s ? ((pts.c[c.id] || 0) - s.mu) / s.sd : 0;
    return Math.max(1, Math.min(99, Math.round(50 + 18 * z)));
  });
  var species = top3(Q.species, function (sp) {
    var t = sp.tags.map(function (tag) { return norm("s", tag); });
    // 第一个标签最重要，第二个次之，第三个再次
    return LOOK_W * norm("l", sp.look) + 2 * t[0] + 1.5 * (t[1] || 0) + 0.75 * (t[2] || 0) + cal("s", sp.id);
  });
  var backgrounds = top3(Q.backgrounds, function (b) { return raw("b", b.id) + cal("b", b.id); });

  // 流派：每个推荐职业，在自己的几个流派里挑风格最对得上的
  // 主风格每分算 2，次风格每分算 1；分数打平时按校准过的权重抽签（每个名字结果固定）
  function subScore(sc) {
    var u = Math.min(0.999999, Math.max(0.000001, nameHash((name || "") + "#" + sc.id)));
    var gumbel = -Math.log(-Math.log(u));
    return 2 * (pts.y[sc.p] || 0) + (pts.y[sc.s] || 0) + 0.01 * (cal("y", sc.id) + gumbel);
  }
  var classSubs = classes.map(function (c) {
    return (Q.subclasses || []).filter(function (sc) { return sc.cls === c.id; })
      .map(function (sc) { return { sc: sc, score: subScore(sc) }; })
      .sort(function (a, b) { return b.score - a.score; })
      .map(function (x) { return x.sc; });
  });

  var CUT = Q.alignCut || { lawful: 2, chaotic: -2, good: 2, evil: -2 };
  var law = lc >= CUT.lawful ? "L" : lc <= CUT.chaotic ? "C" : "N";
  var good = ge >= CUT.good ? "G" : ge <= CUT.evil ? "E" : "N";
  var key = law === "N" && good === "N" ? "N" : law + good;
  var alignment = Q.alignments[key];

  // 两条阵营轴各自可能的最低分和最高分（用来画“你在哪”的位置条）
  var range = { lcMin: 0, lcMax: 0, geMin: 0, geMax: 0 };
  Q.questions.forEach(function (qq, qi) {
    if (!answers[qi].length) return;
    var lcs = qq.o.map(function (op) { return (op.a && op.a.lc) || 0; });
    var ges = qq.o.map(function (op) { return (op.a && op.a.ge) || 0; });
    range.lcMin += Math.min.apply(null, lcs); range.lcMax += Math.max.apply(null, lcs);
    range.geMin += Math.min.apply(null, ges); range.geMax += Math.max.apply(null, ges);
  });

  return {
    classes: classes,
    classForced: classForced,
    classPct: classPct,
    classSubs: classSubs,
    species: species,
    backgrounds: backgrounds,
    alignmentKey: key,
    alignment: alignment,
    cut: CUT,
    lc: lc,
    ge: ge,
    range: range
  };
}

if (typeof module !== "undefined") module.exports = {
  quizScore: quizScore, quizBuildRun: quizBuildRun, quizEncode: quizEncode, quizDecode: quizDecode,
  quizSwap: quizSwap, quizCanSwap: quizCanSwap
};

</script>
<script>
(function () {
  var Q = null; // 本次抽到的题
  var state = { name: "", answers: [], i: 0, result: null };
  var $ = function (id) { return document.getElementById(id); };
  // 第 i 题属于第几章
  function chapterOf(i) {
    var k = 0;
    Q.stages.forEach(function (s, j) { if (s.at <= i) k = j; });
    return k;
  }

  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("on"); });
    $(id).classList.add("on");
    window.scrollTo(0, 0);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function stageAt(i) {
    for (var k = 0; k < Q.stages.length; k++) if (Q.stages[k].at === i) return Q.stages[k];
    return null;
  }

  // ----- 开始 -----
  $("btn-start").addEventListener("click", function () {
    var n = $("name").value.trim();
    if (!n) { $("name-err").textContent = "先填个名字，主持人才知道这是谁的结果"; $("name").focus(); return; }
    $("name-err").textContent = "";
    state.name = n;
    Q = quizBuildRun(QUIZ);
    state.answers = Q.questions.map(function () { return []; });
    state.i = 0;
    goTo(0, true);
  });
  $("name").addEventListener("keydown", function (e) { if (e.key === "Enter") $("btn-start").click(); });
  $("name").addEventListener("input", function () { $("name-err").textContent = ""; });

  // ----- 章节 -----
  var pendingIndex = 0;
  function showChapter(st, i) {
    pendingIndex = i;
    $("ch-title").textContent = st.title;
    $("ch-text").textContent = st.text;
    show("s-chapter");
    $("btn-chapter").focus();
  }
  $("btn-chapter").addEventListener("click", function () { renderQuestion(pendingIndex); });

  // ----- 答题 -----
  function goTo(i, forward) {
    var st = stageAt(i);
    if (forward && st) showChapter(st, i);
    else renderQuestion(i);
  }

  function renderTicks(i) {
    var html = "";
    Q.stages.forEach(function (s, g) {
      var end = g + 1 < Q.stages.length ? Q.stages[g + 1].at : Q.questions.length;
      html += '<div class="grp" style="flex:' + (end - s.at) + '">';
      for (var n = s.at; n < end; n++) {
        var cls = n === i ? "now" : state.answers[n].length ? "done" : "";
        html += '<i class="' + cls + '"></i>';
      }
      html += "</div>";
    });
    $("ticks").innerHTML = html;
  }

  function renderQuestion(i, note) {
    state.i = i;
    var q = Q.questions[i];
    renderTicks(i);
    $("ch-label").textContent = Q.stages[chapterOf(i)].title;
    $("q-count").textContent = "第 " + (i + 1) + " 题 / 共 " + Q.questions.length + " 题";
    $("q-text").textContent = q.q;
    var box = $("q-opts");
    box.innerHTML = "";
    q.order.forEach(function (oi) {
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = q.texts[oi];
      b.setAttribute("data-oi", oi);
      b.addEventListener("click", function () { toggle(i, oi); });
      box.appendChild(b);
    });
    $("q-note").textContent = note || "";
    $("q-note").classList.remove("warn");
    $("btn-back").hidden = i === 0;
    refresh(i);
    show("s-quiz");
  }

  // 更新选中状态、“下一题”按钮和“换一道”按钮
  function refresh(i) {
    var picks = state.answers[i];
    document.querySelectorAll("#q-opts .opt").forEach(function (b) {
      var on = picks.indexOf(+b.getAttribute("data-oi")) !== -1;
      b.classList.toggle("picked", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var nx = $("btn-next");
    nx.disabled = picks.length === 0;
    nx.textContent = i === Q.questions.length - 1 ? "看结果" : "下一题";
    var sw = $("btn-swap");
    var can = quizCanSwap(Q, i);
    sw.disabled = !can;
    sw.textContent = can ? "都不像我，换一道" : "这类题换完了，选个最接近的吧";
  }

  function toggle(i, oi) {
    var picks = state.answers[i];
    var at = picks.indexOf(oi);
    $("q-note").textContent = "";
    $("q-note").classList.remove("warn");
    if (at !== -1) {
      picks.splice(at, 1);
    } else if (picks.length >= 2) {
      $("q-note").textContent = "最多选两个，先取消一个再选";
      $("q-note").classList.add("warn");
      return;
    } else {
      picks.push(oi);
    }
    refresh(i);
  }

  $("btn-next").addEventListener("click", function () {
    var i = state.i;
    if (!state.answers[i].length) return;
    if (i + 1 < Q.questions.length) goTo(i + 1, true);
    else finish();
  });

  $("btn-swap").addEventListener("click", function () {
    var i = state.i;
    if (quizSwap(Q, i)) {
      state.answers[i] = [];
      renderQuestion(i, "换了一道新题");
    } else {
      refresh(i);
    }
  });

  $("btn-back").addEventListener("click", function () {
    if (state.i > 0) renderQuestion(state.i - 1);
  });

  // ----- 结果 -----
  function finish() {
    state.result = quizScore(Q, state.answers, state.name);
    show("s-roll");
    var die = $("roll-die");
    die.classList.remove("spin");
    void die.offsetWidth;
    die.classList.add("spin");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(renderResult, reduce ? 300 : 1600);
  }

  function stars(n) {
    var word = ["", "简单", "中等", "较难"][n];
    return '<span class="star">' + "★★★".slice(0, n) + "☆☆☆".slice(0, 3 - n) + "</span> " + word;
  }

  function fit(p) {
    return '<div class="fit"><span class="fit-l">契合度</span><span class="fit-bar"><i style="width:' + p + '%"></i></span><span class="fit-n">' + p + "%</span></div>";
  }

  // 推荐流派：subs 是这个职业的流派，第一个是最适合的
  function subBlock(subs, full) {
    var sc = subs[0];
    var html = '<div class="sub"><span class="sub-l">推荐流派</span><b>' + esc(sc.zh) + '</b><span class="en">' + esc(sc.en) + "</span>" +
      '<span class="diff"> ' + stars(sc.stars) + "</span><br>" + esc(sc.desc);
    if (full) html += '<p class="sub-others">同职业的其他流派：' + subs.slice(1).map(function (x) { return esc(x.zh); }).join("、") + "</p>";
    return html + "</div>";
  }

  function pickBlock(list, withStars, forced, pcts, subs) {
    var m = list[0];
    var html = '<div class="pick-main"><div class="nm">' + esc(m.zh) + '<span class="en">' + esc(m.en) + "</span></div>";
    if (pcts) html += fit(pcts[0]);
    if (withStars) html += '<div class="diff">上手难度 ' + stars(m.stars) + "</div>";
    if (m.lore) {
      html += '<p class="lore">' + esc(m.lore) + "</p>";
      html += '<p class="plain">简单说：' + esc(m.desc) + "</p>";
    } else {
      html += "<p>" + esc(m.desc) + "</p>";
    }
    if (subs) html += subBlock(subs[0], true);
    html += "</div>";
    html += '<div class="alts"><p class="lbl">也挺适合你</p>';
    list.slice(1).forEach(function (a, k) {
      var f = forced && forced[k + 1];
      html += '<div class="alt">';
      if (f) html += '<span class="tagline-s">' + (f === "melee" ? "想打近战的话：" : "想用魔法的话：") + "</span>";
      html += '<b>' + esc(a.zh) + '</b><span class="en">' + esc(a.en) + "</span>";
      if (withStars) html += '<span class="diff"> ' + stars(a.stars) + "</span>";
      if (pcts) html += fit(pcts[k + 1]);
      html += (pcts ? "" : "<br>") + esc(a.desc);
      if (subs) html += subBlock(subs[k + 1], false);
      if (a.lore) html += '<details class="more"><summary>展开介绍</summary><p class="lore">' + esc(a.lore) + "</p></details>";
      html += "</div>";
    });
    return html + "</div>";
  }

  function renderGrid(key) {
    var cols = [["L", "守序"], ["N", "中立"], ["C", "混乱"]];
    var rows = [["G", "善良"], ["N", "中立"], ["E", "邪恶"]];
    var html = '<div></div>' + cols.map(function (c) { return '<div class="ax">' + c[1] + "</div>"; }).join("");
    rows.forEach(function (r) {
      html += '<div class="ax">' + r[1] + "</div>";
      cols.forEach(function (c) {
        var k = c[0] === "N" && r[0] === "N" ? "N" : c[0] + r[0];
        var a = Q.alignments[k];
        html += '<div class="cell' + (k === key ? " lit" : "") + '">' + a.zh + "</div>";
      });
    });
    $("r-grid").innerHTML = html;
  }

  // 位置条：左边是守序 / 善良，右边是混乱 / 邪恶，和九宫格方向一致
  function axisRow(left, right, val, max, min, note, hi, lo) {
    var pos = function (v) { return max === min ? 50 : Math.round((max - v) / (max - min) * 100); };
    var pct = Math.max(3, Math.min(97, pos(val)));
    // 阵营的分界线：分数 >= hi 算左边，<= lo 算右边
    var cut1 = pos(hi - 0.5);
    var cut2 = pos(lo + 0.5);
    return '<div><div class="axis-row"><span class="end">' + left + '</span><div class="track">' +
      '<span class="third" style="left:' + cut1 + '%"></span><span class="third" style="left:' + cut2 + '%"></span>' +
      '<span class="dot" style="left:' + pct + '%"></span></div><span class="end">' + right + "</span></div>" +
      '<p class="axis-note">' + esc(note) + "</p></div>";
  }

  function renderAlign(r) {
    var a = r.alignment, g = r.range;
    var html = '<div class="axes">' +
      axisRow("守序", "混乱", r.lc, g.lcMax, g.lcMin, Q.alignAxes.lc, r.cut.lawful, r.cut.chaotic) +
      axisRow("善良", "邪恶", r.ge, g.geMax, g.geMin, Q.alignAxes.ge, r.cut.good, r.cut.evil) + "</div>";
    html += '<p class="align-desc"><b>' + esc(a.zh) + '</b><span class="en" style="color:var(--muted);font-size:14px;margin-left:6px">' + esc(a.en) + "</span></p>";
    html += '<p class="lore">' + esc(a.lore) + "</p>";
    html += '<p class="like">就像' + esc(a.like) + "</p>";
    if (r.alignmentKey.indexOf("E") !== -1) {
      html += '<p class="warn">测出邪恶也别慌，这只是角色的性格。不过邪恶角色要提前和主持人商量，确保大家都玩得开心。</p>';
    }
    $("r-align").innerHTML = html;
  }

  function conceptText(r) {
    var c = r.classes[0], s = r.species[0], b = r.backgrounds[0];
    return "一个" + r.alignment.zh + "的" + s.zh + c.zh + "（" + r.classSubs[0][0].zh + "），当冒险者之前是个" + b.zh + "。";
  }

  function renderResult() {
    var r = state.result;
    var c = r.classes[0], s = r.species[0], b = r.backgrounds[0];
    $("r-name").textContent = state.name;
    $("r-concept").innerHTML = "一个<span class=\"a\">" + esc(r.alignment.zh) + "</span>的<span class=\"s\">" + esc(s.zh) +
      "</span><span class=\"c\">" + esc(c.zh) + "</span>（" + esc(r.classSubs[0][0].zh) + "），当冒险者之前是个<span class=\"b\">" + esc(b.zh) + "</span>。";
    $("r-tagline").textContent = r.alignment.desc + "。";
    $("r-class").innerHTML = '<p class="sub-note">“流派”是同一个职业到 3 级以后分出的不同路数。每个职业下面，都推荐了最适合你的一种。</p>' +
      pickBlock(r.classes, true, r.classForced, r.classPct, r.classSubs);
    $("r-species").innerHTML = pickBlock(r.species, false);
    $("r-bg").innerHTML = pickBlock(r.backgrounds, false);
    renderGrid(r.alignmentKey);
    renderAlign(r);
    show("s-result");
    send();
  }

  // ----- 交给主持人 -----
  function label(x) { return x.zh + " " + x.en; }
  function answerCode() {
    // 每题一个字符：记下选了哪几个选项（“0”表示跳过），方便以后核对
    return quizEncode(state.answers, Q);
  }
  function send() {
    var st = $("r-status");
    if (!SHEET_URL) {
      st.textContent = "汇总地址还没设置，这次结果不会交给主持人。";
      return;
    }
    var r = state.result;
    var payload = {
      name: state.name,
      class1: label(r.classes[0]) + " · " + label(r.classSubs[0][0]),
      class2: label(r.classes[1]) + " · " + label(r.classSubs[1][0]),
      class3: label(r.classes[2]) + " · " + label(r.classSubs[2][0]),
      sub1: label(r.classSubs[0][0]), sub2: label(r.classSubs[1][0]), sub3: label(r.classSubs[2][0]),
      pct1: r.classPct[0], pct2: r.classPct[1], pct3: r.classPct[2],
      swaps: Q.questions.filter(function (q) { return q.spare >= 0; }).length,
      species1: label(r.species[0]), species2: label(r.species[1]), species3: label(r.species[2]),
      bg1: label(r.backgrounds[0]), bg2: label(r.backgrounds[1]), bg3: label(r.backgrounds[2]),
      alignment: label(r.alignment),
      concept: conceptText(r),
      answers: answerCode()
    };
    st.textContent = "正在把结果交给主持人……";
    fetch(SHEET_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      st.textContent = "✓ 结果已交给主持人。";
    }).catch(function () {
      st.innerHTML = "结果没交上去，可能是网络问题。<button type=\"button\" id=\"retry\">再交一次</button>";
      $("retry").addEventListener("click", send);
    });
  }

  $("btn-again").addEventListener("click", function () {
    $("name").value = state.name;
    show("s-start");
  });
})();
</script>
</body>
</html>
